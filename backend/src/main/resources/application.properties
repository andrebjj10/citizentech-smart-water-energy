spring.application.name=citizentech-api
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/estacao
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Confirma os commits sem o atraso padrao de 500 ms do H2.
# Mantem a URL exigida pelo enunciado exatamente como fornecida.
spring.datasource.hikari.connection-init-sql=SET WRITE_DELAY 0
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
